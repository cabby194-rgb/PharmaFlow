<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Towa Order - Alberto Bergaglio</title>
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/albeberg/ordine/main/icon.png">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0A2540; --teal: #00A896; --fog: #F4F7FA; }
        body { font-family: 'DM Sans', sans-serif; background: var(--fog); margin: 0; padding: 15px; padding-bottom: 30px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--fog); padding-bottom: 15px; }
        .header h1 { color: var(--navy); font-size: 24px; margin: 5px 0; }
        .subtitle { color: var(--teal); font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; background: var(--fog); font-size: 16px; }

        .section-name { background: var(--navy); color: white; padding: 8px 15px; border-radius: 8px; font-size: 13px; margin: 20px 0 10px 0; font-weight: bold; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid var(--fog); }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 15px; color: var(--navy); display: block; }
        .item-desc { font-size: 12px; color: #999; }
        
        .qty-input { width: 60px; padding: 8px; border: 2px solid var(--fog); border-radius: 8px; text-align: center; font-weight: bold; font-size: 16px; color: var(--teal); }
        .qty-input:focus { border-color: var(--teal); outline: none; background: white; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; transition: 0.2s; }
        .btn-check { background: var(--navy); color: white; }
        .btn-wa { background: #25D366; color: white; }
        .btn-pdf { background: var(--teal); color: white; }
        .btn-edit { background: #eee; color: #666; }

        #modal-review { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .review-title { color: var(--navy); border-bottom: 2px solid var(--teal); padding-bottom: 10px; margin-bottom: 20px; }
        .review-list { margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="main-app" class="container">
    <div class="header">
        <div class="subtitle">Agente Towa Pharmaceutical</div>
        <h1>Alberto Bergaglio</h1>
    </div>

    <label>Farmacia</label>
    <input type="text" id="farmName" placeholder="Nome della farmacia">

    <label>Note</label>
    <textarea id="farmNotes" rows="2" placeholder="Note per l'ordine..."></textarea>

    <div class="section-name">Cardiovascolare</div>
    <div class="item-row"><div class="item-info"><span class="item-name">Ramipril</span><span class="item-desc">Tutti i dosaggi</span></div><input type="number" class="qty-input" data-name="Ramipril" min="0"></div>
    <div class="item-row"><div class="item-info"><span class="item-name">Atorvastatina</span><span class="item-desc">10/20/40/80 mg</span></div><input type="number" class="qty-input" data-name="Atorvastatina" min="0"></div>
    <div class="item-row"><div class="item-info"><span class="item-name">Bisoprololo</span><span class="item-desc">Dosaggi cardiologici</span></div><input type="number" class="qty-input" data-name="Bisoprololo" min="0"></div>

    <div class="section-name">Gastrointestinale</div>
    <div class="item-row"><div class="item-info"><span class="item-name">Pantoprazolo</span><span class="item-desc">20/40 mg</span></div><input type="number" class="qty-input" data-name="Pantoprazolo" min="0"></div>
    <div class="item-row"><div class="item-info"><span class="item-name">Omeprazolo</span><span class="item-desc">10/20 mg</span></div><input type="number" class="qty-input" data-name="Omeprazolo" min="0"></div>

    <div class="section-name">Dolore e SNC</div>
    <div class="item-row"><div class="item-info"><span class="item-name">Ibuprofene</span><span class="item-desc">400/600 mg</span></div><input type="number" class="qty-input" data-name="Ibuprofene" min="0"></div>
    <div class="item-row"><div class="item-info"><span class="item-name">Paracetamolo</span><span class="item-desc">500/1000 mg</span></div><input type="number" class="qty-input" data-name="Paracetamolo" min="0"></div>

    <button class="btn btn-check" onclick="apriRiepilogo()">VERIFICA ORDINE</button>
</div>

<div id="modal-review">
    <h2 class="review-title">Riepilogo Ordine</h2>
    <div id="review-content" class="review-list"></div>
    
    <button class="btn btn-wa" onclick="inviaWA()">CONFERMA E INVIA WHATSAPP</button>
    <button class="btn btn-pdf" onclick="scaricaPDF()">SALVA COPIA PDF</button>
    <button class="btn btn-edit" onclick="chiudiRiepilogo()">MODIFICA ORDINE</button>
</div>

<script>
    function getDati() {
        const farmacia = document.getElementById('farmName').value || "Farmacia";
        const note = document.getElementById('farmNotes').value || "Nessuna";
        let righe = [];
        document.querySelectorAll('.qty-input').forEach(input => {
            if(input.value > 0) {
                righe.push({ nome: input.dataset.name, qty: input.value });
            }
        });
        return { farmacia, note, righe };
    }

    function apriRiepilogo() {
        const dati = getDati();
        if(dati.righe.length === 0) { alert("Inserisci almeno un prodotto."); return; }
        
        let html = `<b>Farmacia:</b> ${dati.farmacia}<br><br>`;
        dati.righe.forEach(r => { html += `• ${r.nome}: <b>${r.qty}</b> pz<br>`; });
        html += `<br><b>Note:</b> ${dati.note}`;
        
        document.getElementById('review-content').innerHTML = html;
        document.getElementById('modal-review').style.display = 'block';
        window.scrollTo(0,0);
    }

    function chiudiRiepilogo() { document.getElementById('modal-review').style.display = 'none'; }

    function inviaWA() {
        const dati = getDati();
        let msg = `*ORDINE TOWA - BERGAGLIO*\n\n*Farmacia:* ${dati.farmacia}\n\n`;
        dati.righe.forEach(r => { msg += `- ${r.nome}: *${r.qty}*\n`; });
        msg += `\n*Note:* ${dati.note}`;
        window.open(`https://wa.me/393935687977?text=${encodeURIComponent(msg)}`);
    }

    function scaricaPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const dati = getDati();
        
        doc.setFontSize(10).text("Agente Towa: Alberto Bergaglio", 10, 10);
        doc.setFontSize(18).text("Riepilogo Ordine", 10, 25);
        doc.setFontSize(12).text(`Cliente: ${dati.farmacia}`, 10, 35);
        
        const tab = dati.righe.map(r => [r.nome, r.qty]);
        doc.autoTable({ startY: 45, head: [['Prodotto', 'Quantità']], body: tab });
        doc.save(`Ordine_${dati.farmacia}.pdf`);
    }
</script>
</body>
</html>
